<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440">
  <!--
    The spark test as a flowchart. Each branch leaves the rim at its own point
    along the contact arc rather than from one node, so it reads as its own
    line, and the shape of the branch is the reading: more carbon, more bursts;
    chromium, nickel, tungsten and molybdenum damp them. The dotted branch is
    the honest one, because a spark test says nothing at all about the
    non-ferrous half of the rack.

    Painted in the deck's sk-colour roles, so it re-tints in dark mode with the
    rest of the sketches. Titanium is the one literal colour: white-hot is the
    reading, in either theme, so it keeps a white core over a faint straw halo.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Grinding wheel, running off the left edge of the canvas. -->
    <circle cx="20" cy="227" r="180" fill="var(--sk-stock)" stroke="var(--sk-ink)" stroke-width="2.5"/>
    <circle cx="20" cy="227" r="44" fill="var(--sk-paper)" stroke="var(--sk-ink)" stroke-width="2"/>
    <path d="M150 339A160 160 0 0 1 58 377" stroke="var(--sk-label)" stroke-width="1.4" opacity="0.55"/>
    <path d="M150 339l-15 4l6 14z" fill="var(--sk-label)" stroke="none" opacity="0.55"/>

    <!-- The stretch of rim the bar is riding on: where the sparks come from. -->
    <path d="M172.9 132.0A180 180 0 0 1 172.9 322.0" stroke="var(--sk-highlight)" stroke-width="5" opacity="0.55"/>

    <!-- The unknown bar, held against the rim from above. -->
    <path d="M172 118 L198 152 L48 92 L22 58 Z" fill="var(--sk-stock)" stroke="var(--sk-ink)" stroke-width="2.5"/>

    <!-- One branch per metal, each off its own point on the rim. -->

    <g><!-- Mild steel -->
      <path d="M172.9 132.0C300.3 52.8 550.0 38.0 780.0 38.0" stroke="var(--sk-highlight)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M172.9 132.0C279.9 65.5 473.2 44.4 668.7 39.3" stroke="var(--sk-highlight)" stroke-width="2.4"/>
      <path d="M175.9 142.0C267.9 85.0 428.3 60.3 598.6 51.4" stroke="var(--sk-highlight)" stroke-width="1.4" opacity="0.7"/>
      <path d="M490.3 49.5L518.0 38.1M490.3 49.5L519.7 55.5" stroke="var(--sk-highlight)" stroke-width="1.2"/>
      <path d="M599.1 41.9L627.3 31.7M599.1 41.9L628.2 49.3" stroke="var(--sk-highlight)" stroke-width="1.2"/>
    </g>

    <g><!-- High carbon steel -->
      <path d="M186.7 159.1C325.7 102.6 550.0 92.0 780.0 92.0" stroke="var(--sk-highlight)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M186.7 159.1C281.2 120.7 415.2 103.5 563.6 96.4" stroke="var(--sk-highlight)" stroke-width="2.2"/>
      <path d="M189.7 169.1C271.1 136.5 384.1 118.5 511.0 109.3" stroke="var(--sk-highlight)" stroke-width="1.3" opacity="0.7"/>
      <path d="M311.0 123.7L322.6 111.3M311.0 123.7L326.4 130.9M311.0 123.7L295.6 116.6M311.0 123.7L299.4 136.2" stroke="var(--sk-highlight)" stroke-width="1.1"/>
      <path d="M389.3 111.1L401.7 99.4M389.3 111.1L404.3 119.2M389.3 111.1L374.4 103.0M389.3 111.1L377.0 122.8" stroke="var(--sk-highlight)" stroke-width="1.1"/>
      <path d="M474.0 102.2L486.8 91.1M474.0 102.2L488.5 111.0M474.0 102.2L459.4 93.3M474.0 102.2L461.1 113.3" stroke="var(--sk-highlight)" stroke-width="1.1"/>
    </g>

    <g><!-- Cast iron -->
      <path d="M195.3 186.3C341.4 152.4 550.0 146.0 780.0 146.0" stroke="var(--sk-alert)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M195.3 186.3C262.5 170.7 343.0 160.9 432.6 154.9" stroke="var(--sk-alert)" stroke-width="2.2"/>
      <path d="M300.4 167.7L314.0 159.3M300.4 167.7L315.7 172.2M300.4 167.7L291.0 164.2M300.4 167.7L292.3 173.5" stroke="var(--sk-alert)" stroke-width="1.1"/>
      <path d="M364.4 160.4L378.3 152.5M364.4 160.4L379.6 165.5M364.4 160.4L355.2 156.6M364.4 160.4L356.1 165.9" stroke="var(--sk-alert)" stroke-width="1.1"/>
    </g>

    <g><!-- Stainless 304 -->
      <path d="M199.5 213.4C349.1 202.1 550.0 200.0 780.0 200.0" stroke="var(--sk-highlight)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M199.5 213.4C280.3 207.3 376.0 203.9 483.2 202.0" stroke="var(--sk-highlight)" stroke-width="1.8"/>
      <path d="M436.3 203.0L464.8 193.5M436.3 203.0L465.2 211.1" stroke="var(--sk-highlight)" stroke-width="1.1"/>
    </g>

    <g><!-- High speed steel -->
      <path d="M199.5 240.6C349.1 251.9 550.0 254.0 780.0 254.0" stroke="var(--sk-alert)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M199.5 240.6C244.4 244.0 293.9 246.5 347.4 248.5" stroke="var(--sk-alert)" stroke-width="2.0"/>
      <ellipse cx="347.4" cy="248.5" rx="9" ry="5.5" fill="var(--sk-alert)" stroke="none"/>
    </g>

    <g><!-- Nickel alloy -->
      <path d="M195.3 267.7C341.4 301.6 550.0 308.0 780.0 308.0" stroke="var(--sk-warn)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M195.3 267.7C230.4 275.9 269.1 282.4 310.8 287.7" stroke="var(--sk-warn)" stroke-width="2.0"/>
      <path d="M310.8 287.7q14 -9 28 2q14 11 28 2" stroke="var(--sk-warn)" stroke-width="2.0"/>
    </g>

    <g><!-- Titanium -->
      <path d="M186.7 294.9C325.7 351.4 550.0 362.0 780.0 362.0" stroke="var(--sk-highlight)" stroke-width="1" opacity="0.3" stroke-dasharray="1 7"/>
      <path d="M186.7 294.9C309.0 344.6 497.4 358.8 697.6 361.5" stroke="var(--sk-highlight)" stroke-width="7.5" opacity="0.5"/>
      <path d="M186.7 294.9C309.0 344.6 497.4 358.8 697.6 361.5" stroke="#ffffff" stroke-width="3.0"/>
      <path d="M189.7 304.9C295.0 350.2 453.3 365.0 626.1 369.3" stroke="var(--sk-highlight)" stroke-width="5.8" opacity="0.4"/>
      <path d="M189.7 304.9C295.0 350.2 453.3 365.0 626.1 369.3" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>
      <path d="M412.9 345.8L427.7 337.5M412.9 345.8L425.4 357.3M412.9 345.8L400.4 334.3M412.9 345.8L398.1 354.2" stroke="var(--sk-highlight)" stroke-width="5.0" opacity="0.45"/>
      <path d="M412.9 345.8L427.7 337.5M412.9 345.8L425.4 357.3M412.9 345.8L400.4 334.3M412.9 345.8L398.1 354.2" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M589.9 358.7L604.0 349.3M589.9 358.7L603.2 369.3M589.9 358.7L576.5 348.2M589.9 358.7L575.7 368.2" stroke="var(--sk-highlight)" stroke-width="5.0" opacity="0.45"/>
      <path d="M589.9 358.7L604.0 349.3M589.9 358.7L603.2 369.3M589.9 358.7L576.5 348.2M589.9 358.7L575.7 368.2" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- The honest branch: nothing sparks, so there is no spark to draw. -->
    <path d="M172.9 322.0C300.3 401.2 550.0 416.0 780.0 416.0" stroke="var(--sk-rule)" stroke-width="1.6" stroke-dasharray="3 8" opacity="0.8"/>
  </g>

  <!-- Where each branch lands. -->
  <g>
    <rect x="780" y="16" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="35" font-size="18" font-weight="600" fill="var(--sk-ink)">Mild steel</text>
    <text x="796" y="53" font-size="13.5" fill="var(--sk-label)">Long, straw, few forks</text>
  </g>
  <g>
    <rect x="780" y="70" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="89" font-size="18" font-weight="600" fill="var(--sk-ink)">High carbon steel</text>
    <text x="796" y="107" font-size="13.5" fill="var(--sk-label)">Dense, repeating starbursts</text>
  </g>
  <g>
    <rect x="780" y="124" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="143" font-size="18" font-weight="600" fill="var(--sk-ink)">Cast iron</text>
    <text x="796" y="161" font-size="13.5" fill="var(--sk-label)">Short, red to straw, feathery</text>
  </g>
  <g>
    <rect x="780" y="178" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="197" font-size="18" font-weight="600" fill="var(--sk-ink)">Stainless 304</text>
    <text x="796" y="215" font-size="13.5" fill="var(--sk-label)">Sparse, short, few forks</text>
  </g>
  <g>
    <rect x="780" y="232" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="251" font-size="18" font-weight="600" fill="var(--sk-ink)">High speed steel</text>
    <text x="796" y="269" font-size="13.5" fill="var(--sk-label)">Dull red, bulb-tipped, no bursts</text>
  </g>
  <g>
    <rect x="780" y="286" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="305" font-size="18" font-weight="600" fill="var(--sk-ink)">Nickel alloy</text>
    <text x="796" y="323" font-size="13.5" fill="var(--sk-label)">Very short, orange, wavy tip</text>
  </g>
  <g>
    <rect x="780" y="340" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="359" font-size="18" font-weight="600" fill="var(--sk-ink)">Titanium</text>
    <text x="796" y="377" font-size="13.5" fill="var(--sk-label)">Long, dazzling, white-hot</text>
  </g>
  <g>
    <rect x="780" y="394" width="300" height="44" rx="6" fill="var(--sk-paper)" stroke="var(--sk-rule)" stroke-width="1.4"/>
    <text x="796" y="413" font-size="18" font-weight="600" fill="var(--sk-ink)">Aluminium, copper, brass</text>
    <text x="796" y="431" font-size="13.5" fill="var(--sk-label)">No sparks at all</text>
  </g>

  <text x="60" y="426" font-size="13.5" fill="var(--sk-label)">More carbon means more bursts. Chromium, nickel, tungsten and molybdenum suppress them.</text>
</svg>
